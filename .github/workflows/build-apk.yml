name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev zlib1g-dev zip unzip autoconf automake libtool pkg-config cmake

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0.0"

      - name: Prepare Clean Spec and Main
        run: |
          python3 -c "
          import os, glob

          # Trouver le dossier du projet mobile
          files = glob.glob('**/main_mobile.py', recursive=True) or glob.glob('**/buildozer.spec', recursive=True)
          target_dir = os.path.dirname(files[0]) if files else '.'
          os.chdir(target_dir)
          print('Configuration dans le dossier:', os.getcwd())

          # Generer main.py propre
          with open('main.py', 'w', encoding='utf-8') as f:
              f.write('from main_mobile import SapientiaApp\nif __name__ == \"__main__\":\n    SapientiaApp().run()\n')

          # Forcer un buildozer.spec minimal et fonctionnel
          spec = '''[app]
title = Sapientia Mobile
package.name = sapientiamobile
package.domain = org.sapientia.app
source.dir = .
source.include_exts = py,png,jpg,jpeg,db
version = 1.0.0
requirements = python3,kivy,kivymd,sqlite3
orientation = portrait
fullscreen = 0
android.permissions = INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
android.api = 33
android.minapi = 24
android.archs = arm64-v8a

[buildozer]
log_level = 2
warn_on_root = 1
'''
          with open('buildozer.spec', 'w', encoding='utf-8') as f:
              f.write(spec)
          "

      - name: Build APK with Buildozer
        run: |
          TARGET_DIR=$(python3 -c "import os, glob; files = glob.glob('**/main_mobile.py', recursive=True); print(os.path.dirname(files[0]) if files else '.')")
          cd "$TARGET_DIR"
          echo "Lancement de Buildozer dans: $(pwd)"
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapientia-mobile-apk
          path: "**/bin/*.apk"
          if-no-files-found: error
