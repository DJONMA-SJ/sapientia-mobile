name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev zlib1g-dev zip unzip autoconf automake libtool pkg-config cmake

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0.0"

      - name: Prepare Universal Android App
        run: |
          DIR=$(dirname $(find . -name "main_mobile.py" | head -n 1))
          cd "$DIR"

          echo "import os, sys" > main.py
          echo "from kivy.utils import platform" >> main.py
          echo "if platform == 'android':" >> main.py
          echo "    try:" >> main.py
          echo "        from android.permissions import request_permissions, Permission" >> main.py
          echo "        request_permissions([Permission.READ_EXTERNAL_STORAGE, Permission.WRITE_EXTERNAL_STORAGE])" >> main.py
          echo "    except Exception:" >> main.py
          echo "        pass" >> main.py
          echo "    priv = os.environ.get('ANDROID_PRIVATE', os.path.expanduser('~'))" >> main.py
          echo "    if priv and os.path.exists(priv):" >> main.py
          echo "        os.chdir(priv)" >> main.py
          echo "from main_mobile import SapientiaApp" >> main.py
          echo "if __name__ == '__main__':" >> main.py
          echo "    SapientiaApp().run()" >> main.py

          echo "[app]" > buildozer.spec
          echo "title = Sapientia Mobile" >> buildozer.spec
          echo "package.name = sapientiamobile" >> buildozer.spec
          echo "package.domain = org.sapientia.app" >> buildozer.spec
          echo "source.dir = ." >> buildozer.spec
          echo "source.include_exts = py,png,jpg,jpeg,db" >> buildozer.spec
          echo "version = 1.0.0" >> buildozer.spec
          echo "requirements = python3,kivy,kivymd,pillow,sqlite3" >> buildozer.spec
          echo "orientation = portrait" >> buildozer.spec
          echo "fullscreen = 0" >> buildozer.spec
          echo "android.permissions = INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          echo "android.archs = arm64-v8a, armeabi-v7a" >> buildozer.spec
          echo "" >> buildozer.spec
          echo "[buildozer]" >> buildozer.spec
          echo "log_level = 2" >> buildozer.spec
          echo "warn_on_root = 1" >> buildozer.spec

          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapientia-mobile-apk
          path: "**/bin/*.apk"
          if-no-files-found: error
